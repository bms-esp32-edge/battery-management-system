name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Driver
        - Core logic
        - Algorithm (SOC/SOH/SOP)
        - Safety/protection
        - TUI/CLI
        - Build/CI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include logs, TUI output, or fault codes if relevant.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Native (host build)
        - Real hardware (ESP32-S3)
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety relevance
      options:
        - label: This bug affects protection logic, fault isolation, or the pyro fuse path
